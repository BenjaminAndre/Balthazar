name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Editor + export templates are ~1 GB, so they are cached per Godot version.
      - id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm godot.zip templates.tpz

      - run: echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - run: bash tools/fetch_deps.sh

      # versionCode = MAJOR*10000 + MINOR*100 + PATCH, so each bump installs over the last APK.
      - id: version
        run: |
          v=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)
          IFS=. read -r major minor patch <<< "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          sed -i "s/^version\/code=.*/version\/code=$((major * 10000 + minor * 100 + patch))/" export_presets.cfg

      # A fresh checkout has no .godot/ import cache; export needs it.
      - run: $GODOT --headless --import

      - run: $GODOT --headless -s addons/gut/gut_cmdln.gd

      # The runner ships the Android SDK and JDK 17; Godot finds them through its editor settings.
      # The debug keystore is committed so every build signs the same way and installs as an update.
      - name: Configure Android export
        run: |
          dir=~/.config/godot
          mkdir -p "$dir"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$dir/$f" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          SETTINGS
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$PWD/tools/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - run: |
          mkdir -p build/android build/windows
          $GODOT --headless --export-debug "Android" build/android/balthazar.apk
          test -f build/android/balthazar.apk
          $GODOT --headless --export-release "Windows Desktop" build/windows/Balthazar.exe
          test -f build/windows/Balthazar.exe

      - uses: actions/upload-artifact@v7
        with:
          name: balthazar-android-v${{ steps.version.outputs.version }}
          path: build/android/balthazar.apk
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: balthazar-windows-v${{ steps.version.outputs.version }}
          path: build/windows
          retention-days: 7
